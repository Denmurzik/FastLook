name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\out\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Version.h
        shell: pwsh
        run: |
          $header = Get-Content -Raw src/Common/Version.h
          $m = [regex]::Match($header, '#define\s+FASTLOOK_VERSION_STR\s+"([^"]+)"')
          if (-not $m.Success) { throw 'FASTLOOK_VERSION_STR not found in src/Common/Version.h' }
          $ver = $m.Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$ver") { throw "Tag '$tag' does not match FASTLOOK_VERSION_STR '$ver' (expected v$ver)" }
          "FASTLOOK_VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Create vcpkg binary cache folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.vcxproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: out\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Build
        shell: pwsh
        run: scripts/build.ps1 -Configuration Release

      - name: Unit tests
        shell: pwsh
        run: scripts/test.ps1 -NoBuild

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          }

      - name: Package
        shell: pwsh
        run: scripts/package.ps1 -NoBuild

      - name: Check release assets
        shell: pwsh
        run: |
          $ver = $env:FASTLOOK_VERSION
          $expected = @(
            "FastLook-$ver-portable-x64.zip", "FastLook-$ver-portable-x64.zip.sha256",
            "FastLook-Setup-$ver.exe", "FastLook-Setup-$ver.exe.sha256") | Sort-Object
          $actual = @(Get-ChildItem out/dist -File | ForEach-Object Name) | Sort-Object
          if (Compare-Object $expected $actual) {
            throw "out/dist mismatch.`nExpected: $($expected -join ', ')`nActual: $($actual -join ', ')"
          }

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: out/dist/*
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: out/test-results.xml
          if-no-files-found: ignore

      - name: Upload binlog
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binlog
          path: out/*.binlog
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "FastLook $ver" --generate-notes
